name: ashelf
description: Ashelf, a study library for BCA notes and question papers.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.2
  path_provider: ^2.1.5
  shared_preferences: ^2.3.3
  open_filex: ^4.6.0
  share_plus: ^10.1.4
  pdfx: ^2.11.0
  package_info_plus: ^8.3.0
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.3
  flutter_native_splash: ^2.4.6

flutter:
  uses-material-design: true
  assets:
    - assets/icon/icon.png

flutter_launcher_icons:
  android: true
  ios: false
  image_path: assets/icon/icon.png
  adaptive_icon_background: "#14130F"
  adaptive_icon_foreground: assets/icon/icon_foreground.png
  min_sdk_android: 21

flutter_native_splash:
  color: "#F7F2E9"
  image: assets/icon/splash_logo.png
  color_dark: "#14130F"
  image_dark: assets/icon/splash_logo_dark.png
  android_12:
    color: "#F7F2E9"
    image: assets/icon/splash_logo.png
    color_dark: "#14130F"
    image_dark: assets/icon/splash_logo_dark.png
